<!DOCTYPE html><html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои панорамы</title>    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>    <style>
        :root {
            --bg: #1e1e2e; --text: #cdd6f4; --accent: #89b4fa; --hover: #313244;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; background: #000; }
        #map { width: 100%; height: 100vh; z-index: 1; }

        #panel {
            position: fixed; top: 0; left: 0; width: 320px; height: 100vh;
            background: var(--bg); color: var(--text); z-index: 1000;
            box-shadow: var(--shadow); display: flex; flex-direction: column;
            transition: transform 0.3s;
        }
        #panel.hidden { transform: translateX(-100%); }
        #panel-header {
            padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-between; align-items: center;
        }
        #panel-header h2 { font-size: 17px; }
        .count { font-size: 12px; opacity: 0.6; background: rgba(255,255,255,0.06); padding: 3px 10px; border-radius: 20px; }
        #search {
            margin: 10px 16px; padding: 10px 14px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.06); color: var(--text); font-size: 14px; outline: none;
        }
        #search::placeholder { color: rgba(205,214,244,0.4); }
        #status-line { font-size: 11px; opacity: 0.6; margin: 0 16px 8px; text-align: center; min-height: 16px; }
        #list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
        #list::-webkit-scrollbar { width: 4px; }
        #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .panorama-item {
            padding: 10px 14px; margin: 2px 0; border-radius: 8px; cursor: pointer;
            font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: 0.15s; display: flex; justify-content: space-between; align-items: center;
        }
        .panorama-item:hover { background: var(--hover); }
        .panorama-item.active { background: rgba(137,180,250,0.12); color: var(--accent); }
        .panorama-item .coords { font-size: 11px; opacity: 0.4; margin-left: 8px; flex-shrink: 0; }
        .panorama-item .no-coords { font-size: 11px; color: #f38ba8; margin-left: 8px; flex-shrink: 0; }
        .panorama-item .loading-dot { font-size: 11px; opacity: 0.4; margin-left: 8px; flex-shrink: 0; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        #toggle-panel {
            position: fixed; top: 16px; left: 330px; z-index: 1001;
            width: 38px; height: 38px; border-radius: 50%; background: var(--bg);
            color: var(--text); border: none; cursor: pointer; font-size: 18px;
            box-shadow: var(--shadow); transition: left 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        #toggle-panel.shifted { left: 16px; }
        #toggle-panel:hover { background: #2a2a3c; }

        #layer-control {
            position: fixed; top: 16px; right: 16px; z-index: 1001;
            background: var(--bg); border-radius: 10px; padding: 4px;
            box-shadow: var(--shadow); display: flex; gap: 2px;
        }
        .layer-btn {
            padding: 8px 14px; border: none; background: transparent;
            color: var(--text); cursor: pointer; border-radius: 7px;
            font-size: 13px; font-weight: 500;
        }
        .layer-btn:hover { background: var(--hover); }
        .layer-btn.active { background: var(--accent); color: #1e1e2e; font-weight: 600; }

        #modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.95); justify-content: center; align-items: center;
        }
        #modal-overlay.open { display: flex; }
        #modal-content {
            position: relative; width: 100vw; height: 100vh;
            background: #000; overflow: hidden;
        }
        #panorama-viewer { width: 100%; height: 100%; }
        #modal-close {
            position: absolute; top: 16px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            font-size: 24px; width: 44px; height: 44px; border-radius: 50%;
            cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        #modal-close:hover { background: rgba(255,255,255,0.15); }
        #modal-info-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(0,0,0,0.6); color: #fff;
            padding: 8px 20px; border-radius: 20px; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex; gap: 20px; align-items: center;
        }
        #modal-info-bar span { opacity: 0.8; }
        #modal-info-bar a { color: var(--accent); text-decoration: none; font-weight: 500; }
        #modal-info-bar a:hover { text-decoration: underline; }
        .hint {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 10; color: rgba(255,255,255,0.5); font-size: 12px;
            pointer-events: none; text-align: center;
        }

        @media (max-width: 600px) {
            #panel { width: 100vw; }
            #toggle-panel { left: auto; right: 12px; top: 12px; }
            #layer-control { top: auto; bottom: 20px; right: 12px; }
            #modal-close { top: 10px; right: 10px; width: 38px; height: 38px; font-size: 20px; }
            #modal-info-bar { bottom: 12px; padding: 6px 14px; font-size: 12px; gap: 12px; }
        }
    </style></head>
<body>    <div id="map"></div>    <div id="panel">
        <div id="panel-header">
            <h2>📷 Панорамы</h2>
            <span class="count" id="panorama-count">0</span>
        </div>
        <input type="text" id="search" placeholder="🔍 Поиск по названию..." autocomplete="off">
        <div id="status-line">Загрузка...</div>
        <div id="list"></div>
    </div>
<button id="toggle-panel" title="Скрыть/показать панель">☰</button>
    <div id="layer-control">
        <button class="layer-btn active" data-layer="vector">🗺 Вектор</button>
        <button class="layer-btn" data-layer="satellite">🛰 Спутник</button>
    </div>    <div id="modal-overlay">
        <div id="modal-content">
            <button id="modal-close" title="Закрыть (Esc)">✕</button>
            <div id="panorama-viewer"></div>
            <div class="hint">🖱 Перетаскивайте для обзора · Колесо для зума</div>
            <div id="modal-info-bar">
                <span id="modal-name"></span>
                <a id="modal-download" href="#" target="_blank">Открыть файл ↗</a>
            </div>
        </div>
    </div>    <script>
        (function () {
            // ==================== ВСТРОЕННЫЙ СПИСОК ФАЙЛОВ ====================
            // При добавлении новых панорам — просто допишите имя файла сюда.
            // Сайт сам подхватит, без запросов к GitHub API.
            const FILE_LIST = [
                "20240808_193155_444.jpg",

                "Рудра s_20250803_131437109.PHOTOSPHERE~2.jpg",
                "Рудра s_20260131_173044915.PHOTOSPHERE.jpg",
                "c1fb2c664bc08af376e86c808f9cdc28_144984.25_1734813076281.jpg",
                "dji_fly_20221204_091144_6_1670134680665_pano_optimized.jpg",

                "dji_fly_20230628_211126_619_1718747835822_pano_optimized.jpg",
                "dji_fly_20230629_210930_628_1718742455660_pano_optimized.jpg",
                "dji_fly_20230701_075408_675_1718742507484_pano_optimized.jpg",
                "dji_fly_20230701_075702_678_1718742531960_pano_optimized.jpg",
                "dji_fly_20230701_200752_683_1718742533568_pano_optimized.jpg",
                "dji_fly_20230701_200918_684_1718742535194_pano_optimized.jpg",
                "dji_fly_20230702_182558_690_1718742537039_pano_optimized.jpg",
                "dji_fly_20230703_202238_726_1718743208552_pano_optimized.jpg",
                "dji_fly_20230704_112230_727_1718742538918_pano_optimized.jpg",
                "dji_fly_20230704_112408_728_1718743206971_pano_optimized.jpg",
                "dji_fly_20230704_113252_737_1718742591528_pano_optimized.jpg",
                "dji_fly_20230704_113642_740_1718742589820_pano_optimized.jpg"
            ];

            const REPO_OWNER = 'nvkff';
            const REPO_NAME = 'Panomap';
            const PANORAMA_DIR = 'panoramas';
            const CACHE_KEY = 'pano_cache_v3';

            // ==================== Карта ====================
            const map = L.map('map').setView([55.75, 37.62], 5);
            const vectorLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OSM', maxZoom: 19
            });
            const satelliteLayer = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '© Esri', maxZoom: 19
                }
            );
            vectorLayer.addTo(map);
            const markersGroup = L.layerGroup().addTo(map);
            const markersMap = new Map();

            document.querySelectorAll('.layer-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (btn.dataset.layer === 'vector') {
                        map.removeLayer(satelliteLayer); vectorLayer.addTo(map);
                    } else {
                        map.removeLayer(vectorLayer); satelliteLayer.addTo(map);
                    }
                });
            });

            const panel = document.getElementById('panel');
            const toggleBtn = document.getElementById('toggle-panel');
            toggleBtn.addEventListener('click', () => {
                panel.classList.toggle('hidden');
                toggleBtn.classList.toggle('shifted');
            });

            // ==================== EXIF ====================
            async function extractGPS(url) {
                try {
                    const resp = await fetch(url);
                    if (!resp.ok) return null;
                    const blob = await resp.blob();
                    const gps = await exifr.gps(blob);
                    if (gps && gps.latitude != null && gps.longitude != null) {
                        return { lat: gps.latitude, lon: gps.longitude };
                    }
                } catch (e) {}
                return null;
            }

            // ==================== Кеш ====================
            function loadCache() {
                try {
                    const raw = localStorage.getItem(CACHE_KEY);
                    return raw ? JSON.parse(raw) : {};
                } catch { return {}; }
            }

            function saveCache(cache) {
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
                } catch (e) {
                    console.warn('localStorage full, clearing old cache');
                    localStorage.removeItem(CACHE_KEY);
                }
            }

            // ==================== Загрузка ====================
            const listEl = document.getElementById('list');
            const searchInput = document.getElementById('search');
            const countEl = document.getElementById('panorama-count');
            const statusLine = document.getElementById('status-line');
            let panoramas = [];

            async function loadPanoramas() {
                // Строим список из встроенного FILE_LIST
                const files = FILE_LIST.map(filename => {
                    const encoded = encodeURIComponent(filename);
                    return {
                        name: filename.replace(/\.[^.]+$/, ''),
                        filename: filename,
                        download_url: `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${PANORAMA_DIR}/${encoded}`
                    };
                });

                if (files.length === 0) {
                    statusLine.textContent = 'Список панорам пуст';
                    listEl.innerHTML = '<div style="padding:20px;opacity:0.5;text-align:center;">Добавьте имена файлов в FILE_LIST внутри index.html</div>';
                    countEl.textContent = '0';
                    return;
                }

                statusLine.textContent = `Найдено ${files.length} панорам. Загружаю координаты...`;
                const cache = loadCache();

                // Сразу показываем список
                panoramas = files.map(f => ({
                    name: f.name,
                    filename: f.filename,
                    download_url: f.download_url,
                    lat: null,
                    lon: null,
                    hasGPS: false,
                    loading: true
                }));
                renderList();

                // Проверяем кеш: если для всех файлов есть координаты — не грузим заново
                let allCached = true;
                for (const f of files) {
                    if (!cache[f.filename] || cache[f.filename].lat == null) {
                        allCached = false;
                        break;
                    }
                }

                if (allCached) {
                    // Мгновенная загрузка из кеша — без запросов!
                    statusLine.textContent = `Загружено из кеша (мгновенно)`;
                    panoramas = files.map(f => ({
                        name: f.name,
                        filename: f.filename,
                        download_url: f.download_url,
                        lat: cache[f.filename].lat,
                        lon: cache[f.filename].lon,
                        hasGPS: true,
                        loading: false
                    }));
                    renderList(searchInput.value);
                    refreshAll();
                    return;
                }

                // Грузим GPS только для новых/отсутствующих в кеше
                for (let i = 0; i < files.length; i++) {
                    const f = files[i];

                    // Если уже в кеше — пропускаем
                    if (cache[f.filename] && cache[f.filename].lat != null) {
                        panoramas[i] = {
                            name: f.name,
                            filename: f.filename,
                            download_url: f.download_url,
                            lat: cache[f.filename].lat,
                            lon: cache[f.filename].lon,
                            hasGPS: true,
                            loading: false
                        };
                        renderList(searchInput.value);
                        continue;
                    }

                    statusLine.textContent = `GPS: ${i + 1} из ${files.length} — ${f.filename}`;

                    const coords = await extractGPS(f.download_url);
                    cache[f.filename] = coords || { lat: null, lon: null };
                    saveCache(cache);

                    panoramas[i] = {
                        name: f.name,
                        filename: f.filename,
                        download_url: f.download_url,
                        lat: coords ? coords.lat : null,
                        lon: coords ? coords.lon : null,
                        hasGPS: coords != null,
                        loading: false
                    };
                    renderList(searchInput.value);
                }

                const withGPS = panoramas.filter(p => p.hasGPS).length;
                statusLine.textContent = `Готово! ${withGPS} с GPS из ${panoramas.length}`;
                refreshAll();
            }

            function renderList(filter = '') {
                listEl.innerHTML = '';
                const filtered = panoramas.filter(p =>
                    p.name.toLowerCase().includes(filter.toLowerCase())
                );
                countEl.textContent = `${filtered.length} / ${panoramas.length}`;

                if (filtered.length === 0) {
                    listEl.innerHTML = '<div style="padding:20px;opacity:0.5;text-align:center;">Ничего не найдено</div>';
                    return;
                }

                filtered.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'panorama-item';
                    if (p.loading) {
                        div.innerHTML = `<span>${p.name}</span><span class="loading-dot">⏳</span>`;
                    } else if (p.hasGPS) {
                        div.innerHTML = `<span>${p.name}</span><span class="coords">${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</span>`;
                    } else {
                        div.innerHTML = `<span>${p.name}</span><span class="no-coords">без GPS</span>`;
                    }
                    div.addEventListener('click', () => {
                        openPanorama(p);
                        if (p.hasGPS) flyToPanorama(p);
                    });
                    listEl.appendChild(div);
                });
            }

            searchInput.addEventListener('input', () => renderList(searchInput.value));

            function createMarkers() {
                markersGroup.clearLayers();
                markersMap.clear();
                const bounds = [];

                panoramas.forEach(p => {
                    if (!p.hasGPS || p.loading) return;
                    const marker = L.marker([p.lat, p.lon])
                        .bindPopup(`<b>${p.name}</b><br>${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`)
                        .on('click', () => openPanorama(p));
                    markersGroup.addLayer(marker);
                    markersMap.set(p, marker);
                    bounds.push([p.lat, p.lon]);
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [40, 40] });
                }
            }

            function flyToPanorama(p) {
                if (!p.hasGPS) return;
                map.flyTo([p.lat, p.lon], 15, { duration: 1 });
                const marker = markersMap.get(p);
                if (marker) marker.openPopup();
            }

            // ==================== ПАНОРАМНЫЙ ПЛЕЕР ====================
            const modalOverlay = document.getElementById('modal-overlay');
            const modalName = document.getElementById('modal-name');
            const modalDownload = document.getElementById('modal-download');
            let currentViewer = null;

            function openPanorama(p) {
                modalOverlay.classList.add('open');
                modalName.textContent = p.name;
                modalDownload.href = p.download_url;
                modalDownload.download = p.filename;

                if (currentViewer) {
                    currentViewer.destroy();
                    currentViewer = null;
                }

                const img = new Image();
                img.onload = function() {
                    const w = this.naturalWidth;
                    const h = this.naturalHeight;
                    const ratio = w / h;

                    let haov;
                    if (ratio >= 1.9 && ratio <= 2.1) {
                        haov = 360;
                    } else if (ratio >= 3.5) {
                        haov = Math.min(360, Math.round(ratio * 60));
                    } else {
                        haov = Math.round(ratio * 40);
                    }

                    currentViewer = pannellum.viewer('panorama-viewer', {
                        type: 'equirectangular',
                        panorama: p.download_url,
                        autoLoad: true,
                        haov: haov,
                        vaov: Math.round(haov / ratio),
                        mouseZoom: true,
                        draggable: true,
                        showZoomCtrl: true,
                        showFullscreenCtrl: true,
                        keyboardZoom: true,
                        friction: 0.15,
                        compass: true,
                        autoRotate: -1,
                        autoRotateInactivityDelay: 3000,
                    });
                };

                img.onerror = function() {
                    currentViewer = pannellum.viewer('panorama-viewer', {
                        type: 'equirectangular',
                        panorama: p.download_url,
                        autoLoad: true,
                        haov: 360,
                        mouseZoom: true,
                        draggable: true,
                        compass: true,
                        autoRotate: -1,
                        autoRotateInactivityDelay: 3000,
                    });
                };

                img.src = p.download_url;
            }

            function closeModal() {
                modalOverlay.classList.remove('open');
                if (currentViewer) {
                    currentViewer.destroy();
                    currentViewer = null;
                }
            }

            document.getElementById('modal-close').addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

            function refreshAll() {
                createMarkers();
                renderList(searchInput.value);
            }

            // ==================== Старт ====================
            loadPanoramas();
        })();
    </script></body>
</html>
