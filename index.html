<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои панорамы</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>

    <style>
        :root {
            --bg: #1e1e2e; --text: #cdd6f4; --accent: #89b4fa; --hover: #313244;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; background: #000; }
        #map { width: 100%; height: 100vh; z-index: 1; }

        #panel {
            position: fixed; top: 0; left: 0; width: 320px; height: 100vh;
            background: var(--bg); color: var(--text); z-index: 1000;
            box-shadow: var(--shadow); display: flex; flex-direction: column;
            transition: transform 0.3s;
        }
        #panel.hidden { transform: translateX(-100%); }
        #panel-header {
            padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-between; align-items: center;
        }
        #panel-header h2 { font-size: 17px; }
        .count { font-size: 12px; opacity: 0.6; background: rgba(255,255,255,0.06); padding: 3px 10px; border-radius: 20px; }
        #search {
            margin: 10px 16px; padding: 10px 14px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.06); color: var(--text); font-size: 14px; outline: none;
        }
        #search::placeholder { color: rgba(205,214,244,0.4); }
        #status-line { font-size: 11px; opacity: 0.6; margin: 0 16px 8px; text-align: center; min-height: 16px; }
        #list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
        #list::-webkit-scrollbar { width: 4px; }
        #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .panorama-item {
            padding: 10px 14px; margin: 2px 0; border-radius: 8px; cursor: pointer;
            font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: 0.15s; display: flex; justify-content: space-between; align-items: center;
        }
        .panorama-item:hover { background: var(--hover); }
        .panorama-item.active { background: rgba(137,180,250,0.12); color: var(--accent); }
        .panorama-item .coords { font-size: 11px; opacity: 0.4; margin-left: 8px; flex-shrink: 0; }
        .panorama-item .no-coords { font-size: 11px; color: #f38ba8; margin-left: 8px; flex-shrink: 0; }
        .panorama-item .loading-dot { font-size: 11px; opacity: 0.4; margin-left: 8px; flex-shrink: 0; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        #toggle-panel {
            position: fixed; top: 16px; left: 330px; z-index: 1001;
            width: 38px; height: 38px; border-radius: 50%; background: var(--bg);
            color: var(--text); border: none; cursor: pointer; font-size: 18px;
            box-shadow: var(--shadow); transition: left 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        #toggle-panel.shifted { left: 16px; }
        #toggle-panel:hover { background: #2a2a3c; }

        #layer-control {
            position: fixed; top: 16px; right: 16px; z-index: 1001;
            background: var(--bg); border-radius: 10px; padding: 4px;
            box-shadow: var(--shadow); display: flex; gap: 2px;
        }
        .layer-btn {
            padding: 8px 14px; border: none; background: transparent;
            color: var(--text); cursor: pointer; border-radius: 7px;
            font-size: 13px; font-weight: 500;
        }
        .layer-btn:hover { background: var(--hover); }
        .layer-btn.active { background: var(--accent); color: #1e1e2e; font-weight: 600; }

        #modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.9); justify-content: center; align-items: center;
        }
        #modal-overlay.open { display: flex; }
        #modal-content {
            position: relative; max-width: 95vw; max-height: 95vh;
            background: #111; border-radius: 12px; overflow: hidden;
        }
        #modal-close {
            position: absolute; top: 10px; right: 16px; z-index: 10;
            background: rgba(0,0,0,0.5); color: #fff; border: none;
            font-size: 28px; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; line-height: 1;
        }
        #modal-close:hover { background: rgba(255,255,255,0.2); }
        #modal-image-wrap { max-height: 80vh; overflow: auto; display: flex; justify-content: center; }
        #modal-image-wrap::-webkit-scrollbar { height: 6px; }
        #modal-image-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        #modal-image { height: 75vh; width: auto; object-fit: contain; }
        #modal-info {
            padding: 12px 20px; display: flex; justify-content: space-between;
            align-items: center; color: #ccc; font-size: 14px;
        }
        #modal-info a { color: var(--accent); text-decoration: none; }
        #modal-info a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            #panel { width: 100vw; }
            #toggle-panel { left: auto; right: 12px; top: 12px; }
            #layer-control { top: auto; bottom: 20px; right: 12px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="panel">
        <div id="panel-header">
            <h2>📷 Панорамы</h2>
            <span class="count" id="panorama-count">0</span>
        </div>
        <input type="text" id="search" placeholder="🔍 Поиск по названию..." autocomplete="off">
        <div id="status-line">Загрузка списка...</div>
        <div id="list"></div>
    </div>

    <button id="toggle-panel" title="Скрыть/показать панель">☰</button>

    <div id="layer-control">
        <button class="layer-btn active" data-layer="vector">🗺 Вектор</button>
        <button class="layer-btn" data-layer="satellite">🛰 Спутник</button>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <button id="modal-close">&times;</button>
            <div id="modal-image-wrap">
                <img id="modal-image" src="" alt="">
            </div>
            <div id="modal-info">
                <span id="modal-name"></span>
                <a id="modal-download" href="#" target="_blank">Открыть полностью ↗</a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // ==================== НАСТРОЙКИ ====================
            const REPO_OWNER = 'ВАШ_ЛОГИН';     // ← ЗАМЕНИТЕ на ваш GitHub-логин
            const REPO_NAME = 'ВАШ_РЕПОЗИТОРИЙ'; // ← ЗАМЕНИТЕ на название репозитория
            const PANORAMA_DIR = 'panoramas';
            const CACHE_KEY = 'pano_cache_v2';

            // ==================== Карта ====================
            const map = L.map('map').setView([55.75, 37.62], 5);
            const vectorLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OSM', maxZoom: 19
            });
            const satelliteLayer = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '© Esri', maxZoom: 19
                }
            );
            vectorLayer.addTo(map);
            const markersGroup = L.layerGroup().addTo(map);
            const markersMap = new Map();

            document.querySelectorAll('.layer-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (btn.dataset.layer === 'vector') {
                        map.removeLayer(satelliteLayer); vectorLayer.addTo(map);
                    } else {
                        map.removeLayer(vectorLayer); satelliteLayer.addTo(map);
                    }
                });
            });

            const panel = document.getElementById('panel');
            const toggleBtn = document.getElementById('toggle-panel');
            toggleBtn.addEventListener('click', () => {
                panel.classList.toggle('hidden');
                toggleBtn.classList.toggle('shifted');
            });

            // ==================== GitHub API ====================
            async function fetchFileList() {
                const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${PANORAMA_DIR}`;
                const resp = await fetch(url);
                if (!resp.ok) {
                    throw new Error(`GitHub API error: ${resp.status}. Проверьте REPO_OWNER и REPO_NAME в коде.`);
                }
                const data = await resp.json();
                const imageExts = ['.jpg', '.jpeg', '.png', '.webp', '.tiff', '.bmp'];
                return data
                    .filter(f => f.type === 'file' && imageExts.some(ext => f.name.toLowerCase().endsWith(ext)))
                    .map(f => ({
                        name: f.name.replace(/\.[^.]+$/, ''),
                        filename: f.name,
                        download_url: f.download_url
                    }));
            }

            // ==================== EXIF ====================
            async function extractGPS(url) {
                try {
                    const resp = await fetch(url);
                    if (!resp.ok) return null;
                    const blob = await resp.blob();
                    const gps = await exifr.gps(blob);
                    if (gps && gps.latitude != null && gps.longitude != null) {
                        return { lat: gps.latitude, lon: gps.longitude };
                    }
                } catch (e) {}
                return null;
            }

            // ==================== Кеш ====================
            function loadCache() {
                try {
                    const raw = localStorage.getItem(CACHE_KEY);
                    return raw ? JSON.parse(raw) : {};
                } catch { return {}; }
            }

            function saveCache(cache) {
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
                } catch (e) {
                    // localStorage переполнен — чистим старые данные
                    console.warn('localStorage full, clearing old cache');
                    localStorage.removeItem(CACHE_KEY);
                }
            }

            // ==================== Загрузка ====================
            const listEl = document.getElementById('list');
            const searchInput = document.getElementById('search');
            const countEl = document.getElementById('panorama-count');
            const statusLine = document.getElementById('status-line');
            let panoramas = [];

            async function loadPanoramas() {
                statusLine.textContent = 'Загрузка списка файлов с GitHub...';

                let files;
                try {
                    files = await fetchFileList();
                } catch (e) {
                    statusLine.textContent = '❌ ' + e.message;
                    listEl.innerHTML = `
                        <div style="padding:20px;opacity:0.7;text-align:center;">
                            <p>Не удалось загрузить список панорам</p>
                            <p style="font-size:12px;margin-top:8px;">Проверьте REPO_OWNER и REPO_NAME в коде</p>
                        </div>`;
                    return;
                }

                if (files.length === 0) {
                    statusLine.textContent = 'Папка panoramas/ пуста';
                    listEl.innerHTML = '<div style="padding:20px;opacity:0.5;text-align:center;">Загрузите панорамы в папку panoramas/</div>';
                    countEl.textContent = '0';
                    return;
                }

                statusLine.textContent = `Найдено файлов: ${files.length}. Загружаю координаты...`;
                const cache = loadCache();

                // Показываем временный список с «загрузкой»
                panoramas = files.map(f => ({
                    name: f.name,
                    filename: f.filename,
                    download_url: f.download_url,
                    lat: null,
                    lon: null,
                    hasGPS: false,
                    loading: true
                }));
                renderList();

                // Загружаем GPS для каждого файла (по одному, чтобы не перегружать)
                for (let i = 0; i < files.length; i++) {
                    const f = files[i];
                    statusLine.textContent = `Обработка ${i + 1} из ${files.length}: ${f.filename}`;

                    let coords = null;

                    // Проверяем кеш
                    if (cache[f.filename] && cache[f.filename].lat != null) {
                        coords = cache[f.filename];
                    } else {
                        coords = await extractGPS(f.download_url);
                        // Сохраняем в кеш
                        cache[f.filename] = coords || { lat: null, lon: null };
                        saveCache(cache);
                    }

                    panoramas[i] = {
                        name: f.name,
                        filename: f.filename,
                        download_url: f.download_url,
                        lat: coords ? coords.lat : null,
                        lon: coords ? coords.lon : null,
                        hasGPS: coords != null,
                        loading: false
                    };
                    renderList(searchInput.value);
                }

                statusLine.textContent = `Готово! ${panoramas.filter(p => p.hasGPS).length} с GPS из ${panoramas.length}`;
                refreshAll();
            }

            function renderList(filter = '') {
                listEl.innerHTML = '';
                const filtered = panoramas.filter(p =>
                    p.name.toLowerCase().includes(filter.toLowerCase())
                );
                countEl.textContent = `${filtered.length} / ${panoramas.length}`;

                if (filtered.length === 0) {
                    listEl.innerHTML = '<div style="padding:20px;opacity:0.5;text-align:center;">Ничего не найдено</div>';
                    return;
                }

                filtered.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'panorama-item';
                    if (p.loading) {
                        div.innerHTML = `<span>${p.name}</span><span class="loading-dot">⏳</span>`;
                    } else if (p.hasGPS) {
                        div.innerHTML = `<span>${p.name}</span><span class="coords">${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</span>`;
                    } else {
                        div.innerHTML = `<span>${p.name}</span><span class="no-coords">без GPS</span>`;
                    }
                    div.addEventListener('click', () => {
                        openPanorama(p);
                        if (p.hasGPS) flyToPanorama(p);
                    });
                    listEl.appendChild(div);
                });
            }

            searchInput.addEventListener('input', () => renderList(searchInput.value));

            function createMarkers() {
                markersGroup.clearLayers();
                markersMap.clear();
                const bounds = [];

                panoramas.forEach(p => {
                    if (!p.hasGPS || p.loading) return;
                    const marker = L.marker([p.lat, p.lon])
                        .bindPopup(`<b>${p.name}</b><br>${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`)
                        .on('click', () => openPanorama(p));
                    markersGroup.addLayer(marker);
                    markersMap.set(p, marker);
                    bounds.push([p.lat, p.lon]);
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [40, 40] });
                }
            }

            function flyToPanorama(p) {
                if (!p.hasGPS) return;
                map.flyTo([p.lat, p.lon], 15, { duration: 1 });
                const marker = markersMap.get(p);
                if (marker) marker.openPopup();
            }

            // Модальное окно
            const modalOverlay = document.getElementById('modal-overlay');
            const modalImage = document.getElementById('modal-image');
            const modalName = document.getElementById('modal-name');
            const modalDownload = document.getElementById('modal-download');

            function openPanorama(p) {
                modalImage.src = p.download_url;
                modalName.textContent = p.name;
                modalDownload.href = p.download_url;
                modalDownload.download = p.filename;
                modalOverlay.classList.add('open');
            }

            function closeModal() {
                modalOverlay.classList.remove('open');
                modalImage.src = '';
            }

            document.getElementById('modal-close').addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

            function refreshAll() {
                createMarkers();
                renderList(searchInput.value);
            }

            // ==================== Старт ====================
            loadPanoramas();
        })();
    </script>
</body>
</html>
